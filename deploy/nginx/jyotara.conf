limit_req_zone $binary_remote_addr zone=jyotara_api:10m rate=5r/s;
server {
 listen 80 default_server;
 listen [::]:80 default_server;
 server_name 168.144.64.47;
 access_log off;
 server_tokens off;
 location ^~ /.well-known/acme-challenge/ { root /var/www/jyotara-acme; }
 location / { return 308 https://168.144.64.47$request_uri; }
}
server {
 listen 443 ssl default_server;
 listen [::]:443 ssl default_server;
 server_name 168.144.64.47;
 ssl_certificate /etc/letsencrypt/live/jyotara-ip/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/jyotara-ip/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 access_log off;
 server_tokens off;
 client_max_body_size 250k;
 client_body_timeout 15s;
 add_header X-Content-Type-Options nosniff always;
 location / {
  limit_req zone=jyotara_api burst=20 nodelay;
  limit_req_status 429;
  proxy_pass http://127.0.0.1:3000;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_connect_timeout 5s;
  proxy_read_timeout 60s;
 }
}
