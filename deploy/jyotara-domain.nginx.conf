server {
 listen 80;
 listen [::]:80;
 server_name api.jyotara.in;
 access_log off;
 server_tokens off;
 location ^~ /.well-known/acme-challenge/ { root /var/www/jyotara-acme; }
 location / { return 308 https://api.jyotara.in$request_uri; }
}
server {
 listen 443 ssl;
 listen [::]:443 ssl;
 server_name api.jyotara.in;
 ssl_certificate /etc/letsencrypt/live/jyotara-api-domain/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/jyotara-api-domain/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 access_log off;
 server_tokens off;
 client_max_body_size 250k;
 client_body_timeout 15s;
 add_header X-Content-Type-Options nosniff always;
 location / {
  limit_req zone=jyotara_api burst=20 nodelay;
  limit_req_status 429;
  proxy_pass http://127.0.0.1:3000;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_connect_timeout 5s;
  proxy_read_timeout 60s;
 }
}
