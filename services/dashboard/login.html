<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jyotara · Team login</title><style>body{background:#0d1210;color:#e9ede7;font:15px system-ui;margin:0;display:grid;place-items:center;min-height:100vh}main{width:min(400px,85vw);padding:30px}h1{font:36px Georgia;color:#dfc58c;margin-bottom:8px}p{color:#a9b3aa;line-height:1.6}label{display:block;margin:24px 0 8px;font-size:13px}input,button{box-sizing:border-box;width:100%;padding:14px;border:1px solid #3a473b;border-radius:8px;background:#19231c;color:#fff;font:inherit}button{background:#dfc58c;color:#131811;margin-top:24px;cursor:pointer}#error{color:#ffb9a4}small{color:#a9b3aa}</style><main><h1>Jyotara</h1><p id="intro">Private dashboard for your team.</p><form id="form"><div id="emailGroup"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required></div><label for="password" id="passwordLabel">Password</label><input id="password" type="password" autocomplete="current-password" required maxlength="128"><button id="submit">Sign in</button><p id="error" role="alert"></p></form><small>Invite-only access · encrypted connection</small></main><script>
window.addEventListener('hashchange',()=>{if(new URLSearchParams(location.hash.slice(1)).has('invite'))location.reload()});
const params=new URLSearchParams(location.hash.slice(1));const invite=params.get('invite');if(invite){history.replaceState(null,'',location.pathname);document.getElementById('emailGroup').hidden=true;document.getElementById('email').required=false;document.getElementById('password').minLength=12;document.getElementById('password').autocomplete='new-password';document.getElementById('passwordLabel').textContent='Create your password (at least 12 characters)';document.getElementById('submit').textContent='Create account';document.getElementById('intro').textContent='Set up your private dashboard login. This invitation works once.'}document.getElementById('form').onsubmit=async e=>{e.preventDefault();const button=document.getElementById('submit');button.disabled=true;try{const r=await fetch('api/'+(invite?'accept':'login'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value,token:invite})});if(!r.ok){const d=await r.json();throw Error(d.error||'Unable to sign in')}location.replace('./')}catch(e){document.getElementById('error').textContent=e.message}finally{button.disabled=false}};
</script></html>
